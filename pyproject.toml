[project]
name = "speed-to-lead"
version = "0.1.0"
description = "WhatsApp-first speed-to-lead system for a paint retail shop (United Trader, Undri, Pune)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
stl = "speed_to_lead.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["speed_to_lead*"]

[tool.setuptools.package-data]
speed_to_lead = ["migrations/*.sql", "data/*.csv"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# HTML templates and bilingual message literals read better unwrapped
"speed_to_lead/{web,dashboard,demo,messages}.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["speed_to_lead", "tests"]

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
